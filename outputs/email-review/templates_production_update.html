<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 30px; border-radius: 8px 8px 0 0; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { background: #f9fafb; padding: 30px; border-radius: 0 0 8px 8px; }
    .info-box { background: white; border-left: 4px solid #6b7280; padding: 20px; margin: 20px 0; }
    .info-row { display: flex; padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-weight: bold; width: 140px; color: #666; }
    .info-value { flex: 1; }
    .status { font-size: 18px; font-weight: bold; color: #6b7280; }
    .progress-container { background: #e5e7eb; border-radius: 10px; height: 24px; overflow: hidden; margin: 15px 0; }
    .progress-bar { background: linear-gradient(90deg, #6b7280 0%, #6b7280dd 100%); height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; transition: width 0.3s ease; }
    .button { display: inline-block; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 14px 28px; text-decoration: none; border-radius: 6px; margin: 20px 0; }
    .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>生産状況更新のお知らせ</h1>
    </div>
    <div class="content">
      <p>가네이 様</p>
      <p>ご注文いただいた製品の生産状況が更新されました。</p>

      <div class="info-box">
        <h3>生産状況</h3>
        <div class="info-row">
          <span class="info-label">注文番号</span>
          <span class="info-value">ORD-E2E-SAMPLE</span>
        </div>
        <div class="info-row">
          <span class="info-label">製品名</span>
          <span class="info-value">커스텀 3지 실링백 10,000개</span>
        </div>
        <div class="info-row">
          <span class="info-label">現在のステータス</span>
          <span class="info-value status">undefined</span>
        </div>
        <div class="info-row">
          <span class="info-label">完了予定日</span>
          <span class="info-value">2026-10-15</span>
        </div>
        <div class="info-row">
          <span class="info-label">更新日時</span>
          <span class="info-value">undefined</span>
        </div>
      </div>

      <div style="background: white; padding: 20px; border-radius: 6px; margin: 20px 0;">
        <h3 style="margin-top: 0;">進捗状況</h3>
        <div class="progress-container">
          <div class="progress-bar" style="width: undefined%;">
            undefined%
          </div>
        </div>
      </div>

      <div style="text-align: center;">
        <a href="https://www.package-lab.com/member/orders/ORD-E2E-SAMPLE" class="button">詳細を確認する</a>
      </div>
    </div>
    <div class="footer">
      <p>このメールはシステムにより自動送信されています。</p>
      <p>お問い合わせ: design@package-lab.com</p>
      <p>© 2026 EPackage Lab. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
