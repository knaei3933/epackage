<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 8px 8px 0 0; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { background: #f9fafb; padding: 30px; border-radius: 0 0 8px 8px; }
    .info-box { background: white; border-left: 4px solid #667eea; padding: 20px; margin: 20px 0; }
    .info-row { display: flex; padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-weight: bold; width: 140px; color: #666; }
    .info-value { flex: 1; }
    .amount { font-size: 20px; font-weight: bold; color: #667eea; }
    .button { display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 28px; text-decoration: none; border-radius: 6px; margin: 20px 0; }
    .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>新しい見積依頼が届きました</h1>
    </div>
    <div class="content">
      <p>テスト株式会社 様</p>
      <p>新しい見積依頼が届きました。</p>

      <div class="info-box">
        <h3>見積依頼詳細</h3>
        <div class="info-row">
          <span class="info-label">見積番号</span>
          <span class="info-value">Q-E2E-SAMPLE</span>
        </div>
        <div class="info-row">
          <span class="info-label">見積ID</span>
          <span class="info-value">00000000-0000-0000-0000-00000000e2e2</span>
        </div>
        <div class="info-row">
          <span class="info-label">顧客名</span>
          <span class="info-value">가네이</span>
        </div>
        <div class="info-row">
          <span class="info-label">会社名</span>
          <span class="info-value">テスト株式会社</span>
        </div>
        <div class="info-row">
          <span class="info-label">見積金額</span>
          <span class="info-value amount">¥446,300</span>
        </div>
        <div class="info-row">
          <span class="info-label">有効期限</span>
          <span class="info-value">2026-10-08</span>
        </div>
        <div class="info-row">
          <span class="info-label">依頼日時</span>
          <span class="info-value">undefined</span>
        </div>
      </div>

      <div style="text-align: center;">
        <a href="https://www.package-lab.com/member/orders/ORD-E2E-SAMPLE" class="button">見積を確認・承認する</a>
      </div>
    </div>
    <div class="footer">
      <p>このメールはシステムにより自動送信されています。</p>
      <p>お問い合わせ: design@package-lab.com</p>
      <p>© 2026 EPackage Lab. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
